<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawl It — High Discount Deals</title>
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --text: #14181f;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --brand: #4f46e5;
    --brand-light: #818cf8;
    --brand-dark: #0f172a;
    --footer-bg: #0b1120;
    --accent: #16a34a;
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    --shadow-hover: 0 12px 24px rgba(15, 23, 42, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0;
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a { color: inherit; }

  /* ---------- Header ---------- */
  header.site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(115deg, #4338ca 0%, #6d28d9 100%);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(76, 29, 149, 0.25);
  }

  header.site-header .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    text-decoration: none;
    color: inherit;
  }

  .header-nav .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .header-nav .home-btn:hover {
    background: rgba(255, 255, 255, 0.26);
  }

  header.site-header .brand-name {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  header.site-header .brand-name .accent {
    color: #fde68a;
  }

  header.site-header .tagline {
    font-size: 0.78rem;
    color: #e0e7ff;
    display: none;
  }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    scroll-margin-top: 60px;
  }

  .page-heading {
    margin-bottom: 20px;
  }

  .category-badge {
    display: inline-block;
    background: #eef2ff;
    color: var(--brand);
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.6rem;
    font-weight: 800;
  }

  p.subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  #status {
    color: var(--text-muted);
    margin: 16px 0;
    font-size: 0.9rem;
  }

  /* ---------- Toolbar: search / sort / price ---------- */
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .search-wrap {
    flex: 1 1 240px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 12px;
    color: var(--text-muted);
  }

  .search-wrap:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
  }

  .search-wrap input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 10px 0;
    font-size: 0.9rem;
    color: var(--text);
    min-width: 0;
  }

  .toolbar select {
    flex: 0 1 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.85rem;
    color: var(--text);
    cursor: pointer;
  }

  .toolbar select:focus-visible,
  .chip:focus-visible,
  .pagination button:focus-visible,
  .back-to-top:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  @media (max-width: 620px) {
    .toolbar select { flex: 1 1 45%; }
  }

  /* ---------- NEW badge ---------- */
  .new-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #f59e0b;
    color: #1f2937;
    font-weight: 800;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    padding: 3px 7px;
    border-radius: 6px;
  }

  /* ---------- Back to top ---------- */
  .back-to-top {
    position: fixed;
    right: 18px;
    bottom: 22px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--brand);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(67, 56, 202, 0.4);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .back-to-top.visible { display: flex; }

  .back-to-top:hover {
    background: #4338ca;
    transform: translateY(-2px);
  }

  /* ---------- Category chips ---------- */
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }

  .chip {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .chip:hover { background: #eef2ff; }

  .chip.active {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  .chip .count {
    font-weight: 400;
    opacity: 0.7;
    margin-left: 4px;
  }

  #status.error {
    color: #dc2626;
  }

  /* ---------- Grid: 4 / 2 / 1 columns ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 620px) {
    main { padding: 16px 14px 32px; }
    header.site-header { padding: 12px 16px; }
    .grid { gap: 12px; }
    .card img { height: 130px; }
    .card .body { padding: 10px 12px 12px; }
    .card .title { font-size: 0.8rem; -webkit-line-clamp: 2; margin-bottom: 8px; }
    .price { font-size: 0.95rem; }
    .discount-badge { font-size: 0.7rem; padding: 3px 6px; }
  }

  @media (max-width: 360px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-3px);
  }

  .card .media {
    position: relative;
    background: #fafafa;
  }

  .card img {
    width: 100%;
    height: 170px;
    object-fit: contain;
    display: block;
    background: #fafafa;
  }

  .discount-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .card .body {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .card .title {
    font-size: 0.88rem;
    line-height: 1.35;
    margin-bottom: 10px;
    flex-grow: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .price {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--text);
  }

  .mrp {
    text-decoration: line-through;
    color: #9ca3af;
    font-size: 0.82rem;
  }

  .meta-row {
    margin-top: 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .store {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .posted-time {
    font-size: 0.72rem;
    color: var(--brand);
    font-weight: 600;
    white-space: nowrap;
  }

  /* ---------- Skeleton loading ---------- */
  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .skeleton .media,
  .skeleton .line {
    background: linear-gradient(90deg, #eceef2 25%, #f6f7fb 37%, #eceef2 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }

  .skeleton .media { height: 170px; }
  .skeleton .body { padding: 12px 14px 14px; }
  .skeleton .line { height: 10px; border-radius: 4px; margin-bottom: 8px; }
  .skeleton .line.short { width: 60%; }

  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }

  /* ---------- Pagination ---------- */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  .pagination button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--brand);
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .pagination button:hover:not(:disabled) {
    background: #eef2ff;
    box-shadow: var(--shadow);
  }

  .pagination button:disabled {
    color: #c7cad1;
    cursor: not-allowed;
  }

  .pagination .page-info {
    font-size: 0.88rem;
    color: var(--text-muted);
    min-width: 90px;
    text-align: center;
  }

  /* ---------- Footer ---------- */
  footer.site-footer {
    position: relative;
    background: var(--footer-bg);
    color: #94a3b8;
    padding: 20px 20px 18px;
    font-size: 0.82rem;
    text-align: center;
  }

  footer.site-footer::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(115deg, #4338ca 0%, #6d28d9 100%);
  }

  footer.site-footer .brand-name {
    color: #fff;
    font-weight: 700;
  }

  footer.site-footer .brand-name .accent {
    color: #c4b5fd;
  }

  @media (min-width: 480px) {
    header.site-header .tagline { display: block; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-name">Crawl<span class="accent">It</span></span>
      <span class="tagline">deal tracking, all in one place</span>
    </a>
    <nav class="header-nav">
      <a class="home-btn" href="/">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Home
      </a>
    </nav>
  </header>

  <main>
    <div class="page-heading">
      <span class="category-badge">Amazon</span>
      <h1>High Discount Deals</h1>
      <p class="subtitle">Products with more than 30% off and MRP up to ₹10,000, sourced from amazon.in</p>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="Search deals… e.g. earbuds, shampoo" aria-label="Search deals">
      </div>
      <select id="sortSelect" aria-label="Sort deals">
        <option value="newest">Newest first</option>
        <option value="discount">Biggest discount</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </select>
      <select id="priceSelect" aria-label="Filter by price">
        <option value="all">Any price</option>
        <option value="0-500">Under ₹500</option>
        <option value="500-2000">₹500 – ₹2,000</option>
        <option value="2000-10000">₹2,000 – ₹10,000</option>
      </select>
    </div>

    <div class="chips" id="chips" hidden></div>
    <div id="status">Loading deals…</div>
    <div class="grid" id="grid"></div>

    <div class="pagination" id="pagination" style="display: none;">
      <button id="firstBtn" aria-label="First page">&#171;</button>
      <button id="prevBtn" aria-label="Previous page">&#8249;</button>
      <span class="page-info" id="pageInfo"></span>
      <button id="nextBtn" aria-label="Next page">&#8250;</button>
    </div>
  </main>

  <button class="back-to-top" id="backToTop" aria-label="Back to top" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 14 7-7 7 7"/></svg>
  </button>

  <footer class="site-footer">
    <span class="brand-name">Crawl<span class="accent">It</span></span> — tracking deals across your favorite stores
  </footer>

  <script>
    const PAGE_SIZE = 12;
    let allProducts = [];
    let currentPage = 1;
    let currentCategory = 'all';
    let searchText = '';
    let sortBy = 'newest';
    let priceBucket = 'all';
    let lastUpdatedText = '';

    const main = document.querySelector('main');
    const grid = document.getElementById('grid');
    const chips = document.getElementById('chips');
    const status = document.getElementById('status');
    const pagination = document.getElementById('pagination');
    const pageInfo = document.getElementById('pageInfo');
    const firstBtn = document.getElementById('firstBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderSkeletons(count) {
      grid.innerHTML = Array.from({ length: count }).map(() => `
        <div class="skeleton">
          <div class="media"></div>
          <div class="body">
            <div class="line"></div>
            <div class="line short"></div>
            <div class="line" style="width:40%"></div>
          </div>
        </div>
      `).join('');
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diffMs = Date.now() - new Date(dateStr).getTime();
      if (!Number.isFinite(diffMs) || diffMs < 0) return '';
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
      const days = Math.floor(hours / 24);
      return `${days} day${days === 1 ? '' : 's'} ago`;
    }

    function cardHtml(p) {
      const posted = timeAgo(p.firstSeenAt);
      const isNew = p.firstSeenAt && (Date.now() - new Date(p.firstSeenAt).getTime()) < 60 * 60 * 1000;
      return `
        <a class="card" href="${p.url}" target="_blank" rel="noopener">
          <div class="media">
            <img src="${p.image || ''}" alt="" loading="lazy" onerror="this.style.display='none'">
            <span class="discount-badge">${p.discountPct}% OFF</span>
            ${isNew ? '<span class="new-badge">NEW</span>' : ''}
          </div>
          <div class="body">
            <div class="title">${p.title}</div>
            <div class="price-row">
              <span class="price">${p.price}</span>
              <span class="mrp">${p.mrp}</span>
            </div>
            <div class="meta-row">
              <span class="store">${p.rating ? `★ ${p.rating} (${p.reviews || 0})` : ''}</span>
              ${posted ? `<span class="posted-time">${posted}</span>` : ''}
            </div>
          </div>
        </a>
      `;
    }

    function prettyLabel(key) {
      return key.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function priceOf(p) {
      const n = Number(String(p.price || '').replace(/[₹,\s]/g, ''));
      return Number.isFinite(n) ? n : null;
    }

    function activeProducts() {
      let items = allProducts;
      if (currentCategory !== 'all') items = items.filter(p => p.category === currentCategory);
      if (searchText) {
        const q = searchText.toLowerCase();
        items = items.filter(p => (p.title || '').toLowerCase().includes(q));
      }
      if (priceBucket !== 'all') {
        const [min, max] = priceBucket.split('-').map(Number);
        items = items.filter(p => {
          const n = priceOf(p);
          return n !== null && n >= min && n <= max;
        });
      }
      items = [...items];
      if (sortBy === 'newest') {
        items.sort((a, b) => new Date(b.firstSeenAt) - new Date(a.firstSeenAt));
      } else if (sortBy === 'discount') {
        items.sort((a, b) => (b.discountPct || 0) - (a.discountPct || 0));
      } else if (sortBy === 'price-asc') {
        items.sort((a, b) => (priceOf(a) ?? Infinity) - (priceOf(b) ?? Infinity));
      } else if (sortBy === 'price-desc') {
        items.sort((a, b) => (priceOf(b) ?? -Infinity) - (priceOf(a) ?? -Infinity));
      }
      return items;
    }

    function renderChips() {
      const counts = {};
      allProducts.forEach(p => {
        const c = p.category || 'other';
        counts[c] = (counts[c] || 0) + 1;
      });
      const keys = Object.keys(counts).sort((a, b) => {
        if (a === 'hot-deals') return -1;
        if (b === 'hot-deals') return 1;
        if (a === 'other') return 1;
        if (b === 'other') return -1;
        return counts[b] - counts[a];
      });
      chips.hidden = keys.length < 2;
      chips.innerHTML = [
        `<button class="chip${currentCategory === 'all' ? ' active' : ''}" data-cat="all">All<span class="count">${allProducts.length}</span></button>`,
        ...keys.map(k =>
          `<button class="chip${currentCategory === k ? ' active' : ''}" data-cat="${k}">${prettyLabel(k)}<span class="count">${counts[k]}</span></button>`
        ),
      ].join('');
    }

    chips.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      currentCategory = btn.dataset.cat;
      renderChips();
      renderPage(1);
    });

    const searchInput = document.getElementById('searchInput');
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchText = searchInput.value.trim();
        renderPage(1);
      }, 200);
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      sortBy = e.target.value;
      renderPage(1);
    });

    document.getElementById('priceSelect').addEventListener('change', (e) => {
      priceBucket = e.target.value;
      renderPage(1);
    });

    const backToTop = document.getElementById('backToTop');
    backToTop.hidden = false;
    function updateBackToTop() {
      backToTop.classList.toggle('visible', window.scrollY > 300);
    }
    window.addEventListener('scroll', updateBackToTop, { passive: true });
    updateBackToTop();
    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function renderPage(page, { scroll = false } = {}) {
      const items = activeProducts();
      const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
      currentPage = Math.min(Math.max(1, page), totalPages);

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = items.slice(start, start + PAGE_SIZE);

      grid.innerHTML = pageItems.map(cardHtml).join('');
      const catLabel = currentCategory === 'all' ? '' : ` in ${prettyLabel(currentCategory)}`;
      const searchLabel = searchText ? ` matching “${searchText}”` : '';
      status.textContent = `${items.length} products${catLabel}${searchLabel} · more than ${window.__minDiscount}% off${lastUpdatedText}`;

      if (!pageItems.length) {
        grid.innerHTML = '';
        status.textContent = searchText
          ? `No deals matching “${searchText}”${catLabel}. Try a different search.`
          : `No deals${catLabel} in this price range right now.`;
      }

      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      firstBtn.disabled = currentPage <= 1;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
      pagination.style.display = items.length > PAGE_SIZE ? 'flex' : 'none';

      if (scroll) {
        main.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    firstBtn.addEventListener('click', () => renderPage(1, { scroll: true }));
    prevBtn.addEventListener('click', () => renderPage(currentPage - 1, { scroll: true }));
    nextBtn.addEventListener('click', () => renderPage(currentPage + 1, { scroll: true }));

    async function load() {
      renderSkeletons(8);

      try {
        const res = await fetch('/api/amazon/deals/high-discount?maxMrp=10000');
        const data = await res.json();

        if (!res.ok) {
          status.textContent = data.error || 'Failed to load products.';
          status.classList.add('error');
          grid.innerHTML = '';
          return;
        }

        if (!data.products.length) {
          status.textContent = 'No deals above the discount threshold right now.';
          grid.innerHTML = '';
          return;
        }

        allProducts = data.products;
        window.__minDiscount = data.minDiscount;
        const newest = allProducts.reduce((m, p) => {
          const t = new Date(p.lastSeenAt || 0).getTime();
          return t > m ? t : m;
        }, 0);
        if (newest) lastUpdatedText = ` · Updated ${timeAgo(new Date(newest).toISOString()).toLowerCase()}`;
        renderChips();
        renderPage(1);
      } catch (err) {
        status.textContent = 'Error loading products: ' + err.message;
        status.classList.add('error');
        grid.innerHTML = '';
      }
    }

    load();
  </script>
</body>
</html>
